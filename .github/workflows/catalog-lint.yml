name: catalog-lint

on:
  pull_request:
    paths:
      - "docs/OPEN_WORK_INDEX.md"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_index.py
